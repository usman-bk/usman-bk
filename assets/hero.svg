<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Usman Virk, Senior Software Engineer</title>
  <desc id="d">A request path through three of his projects: offline-basket settles a cart once, outbox makes a write and its message agree, and push-fanout delivers one notification per person.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10231F"/>
      <stop offset="1" stop-color="#17332C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#7FD8B5">backend engineer, Germany, 7+ years</text>
    <text x="60" y="186" font-size="92" font-weight="700" letter-spacing="-2" fill="#F4F1E8">Usman Virk</text>
    <text x="64" y="244" font-size="34" fill="#D7DED8">Senior Software Engineer.</text>
    <text x="64" y="286" font-size="34" fill="#D7DED8">Building scalable systems.</text>
    <text x="64" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#9DB3AA">Go · TypeScript · PostgreSQL · Redis · Kubernetes</text>
  </g>

  <!-- A request moving through three real projects -->
  <g fill="none" stroke="#7FD8B5" stroke-width="3" stroke-linecap="round">
    <path d="M722 92 V162"/>
    <path d="M722 202 V272"/>
  </g>
  <g fill="#7FD8B5">
    <path d="M714 158 L722 172 L730 158 Z"/>
    <path d="M714 268 L722 282 L730 268 Z"/>
  </g>
  <g fill="#10231F" stroke="#7FD8B5" stroke-width="3">
    <circle cx="722" cy="72" r="14"/>
    <circle cx="722" cy="182" r="14"/>
    <circle cx="722" cy="292" r="14"/>
  </g>
  <g fill="#7FD8B5">
    <circle cx="722" cy="72" r="5"/>
    <circle cx="722" cy="182" r="5"/>
    <circle cx="722" cy="292" r="5"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#F4F1E8">
    <text x="760" y="70">offline-basket</text>
    <text x="760" y="180">outbox</text>
    <text x="760" y="290">push-fanout</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#B9C9C2">
    <text x="760" y="104">200 offline actions, settled once</text>
    <text x="760" y="214">a write and its message agree</text>
    <text x="760" y="324">40,000 devices, one alert per person</text>
  </g>
</svg>
